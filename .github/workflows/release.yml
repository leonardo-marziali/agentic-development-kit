name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # OIDC trusted publishing to npm for packages/ad-lfl-kit (see
  # release.config.js): no NPM_TOKEN secret is stored anywhere. npm CLI
  # exchanges this job's short-lived GitHub identity token for a one-time
  # publish credential scoped to this exact repo + workflow file, and
  # attaches a provenance attestation automatically. Requires the trusted
  # publisher to be configured on npmjs.com for that package first (one-time
  # setup, done from the package's Settings > Publishing access) — until
  # then, publishing fails rather than falling back to any stored token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # semantic-release pushes its git tag with a plain `git push`; without
    # this, `pnpm install`'s `prepare` script installs this repo's Husky
    # hooks into the job's checkout too, and the pre-push hook then blocks
    # that push because HEAD is on main (it can't tell a tag push from a
    # branch push).
    env:
      HUSKY: 0
    steps:
      # REPO_ADMIN (not the default GITHUB_TOKEN) so @semantic-release/git's
      # push of the CHANGELOG.md commit and tag is attributed to an admin
      # account, matching the RepositoryRole bypass actor on the
      # "Require pull request for default branch" ruleset (see
      # terraform/rulesets.tf) — a GitHub App identity can't bypass branch
      # protection on a personal-account-owned repository.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_ADMIN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          # Required for npm's OIDC trusted-publishing exchange, even though
          # pnpm is what actually installs dependencies here.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
