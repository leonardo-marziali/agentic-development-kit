name: Plugin Tests

on:
  # main is a protected branch (see README's "Branch protection" section):
  # every change lands via a pull request, which already ran this workflow
  # against the exact same tree. Re-running on the post-merge push would
  # just repeat that result, so `main` is intentionally not a push trigger.
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # dorny/paths-filter still shells out to `git branch --show-current`
      # to resolve the current ref before it can fall back to the GitHub
      # REST API for the actual diff, so a checkout (even a shallow one) is
      # required regardless of which diffing strategy ends up used.
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/plugin-tests.yml'
            repo-root:
              - '.claude/hooks/**'
              - 'scripts/**'
            ad-lfl-kit:
              - 'packages/ad-lfl-kit/**'
            markdown:
              - 'plugins/markdown/**'
            prettier:
              - 'plugins/prettier/**'

      - name: Build test matrix
        id: set-matrix
        env:
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
          REPO_ROOT_CHANGED: ${{ steps.filter.outputs.repo-root }}
          AD_LFL_KIT_CHANGED: ${{ steps.filter.outputs.ad-lfl-kit }}
          MARKDOWN_CHANGED: ${{ steps.filter.outputs.markdown }}
          PRETTIER_CHANGED: ${{ steps.filter.outputs.prettier }}
        run: |
          entries='[]'
          add() {
            entries=$(echo "$entries" | jq -c --arg n "$1" --arg d "$2" --arg f "$3" \
              '. + [{"name": $n, "dir": $d, "flag": $f}]')
          }
          # A change to the workflow itself is validated against every
          # suite, not just the ones whose own files changed.
          if [ "$WORKFLOW_CHANGED" = "true" ] || [ "$REPO_ROOT_CHANGED" = "true" ]; then
            add "repo-root" "." "repo-root"
          fi
          if [ "$WORKFLOW_CHANGED" = "true" ] || [ "$AD_LFL_KIT_CHANGED" = "true" ]; then
            add "ad-lfl-kit" "packages/ad-lfl-kit" "ad-lfl-kit"
          fi
          if [ "$WORKFLOW_CHANGED" = "true" ] || [ "$MARKDOWN_CHANGED" = "true" ]; then
            add "markdown" "plugins/markdown" "markdown-plugin"
          fi
          if [ "$WORKFLOW_CHANGED" = "true" ] || [ "$PRETTIER_CHANGED" = "true" ]; then
            add "prettier" "plugins/prettier" "prettier-plugin"
          fi
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: test (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # The plugins' hooks shell out to npx at runtime and their suites do
      # the same, so the root devDependencies (Prettier in particular) need
      # to be present for npx's local-bin lookup to resolve offline.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # A plugin with runtime dependencies commits an npm package-lock.json
      # (see AGENT.md), which Claude Code installs with
      # `npm ci --ignore-scripts` when it caches the plugin. Do the same
      # here, so the suite runs against exactly what installed users get.
      - name: Install plugin dependencies
        if: hashFiles(format('{0}/package-lock.json', matrix.suite.dir)) != ''
        working-directory: ${{ matrix.suite.dir }}
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        working-directory: ${{ matrix.suite.dir }}
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.suite.dir }}/coverage/lcov.info
          flags: ${{ matrix.suite.flag }}
          fail_ci_if_error: false

  # `test`'s own check name varies with the matrix (or isn't produced at
  # all when the matrix is empty), so it can't be set as a required status
  # check on the branch ruleset. This job always runs under one stable
  # name and fails iff `test` failed, so it's the one to require instead.
  required:
    name: Required
    needs: [detect, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any affected suite failed
        run: |
          result="${{ needs.test.result }}"
          echo "test job result: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi
