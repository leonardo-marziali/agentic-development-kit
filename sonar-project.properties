sonar.organization=leonardo-marziali
sonar.projectKey=leonardo-marziali_agentic-development-kit

# The Python scripts under plugins/ use zip(strict=True), so 3.10 is the floor.
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# The java plugin's test fixtures are deliberately rule-breaking Java, grouped
# by rule ID (fixtures/rules/D23/, …) rather than by package, and parsed one
# file at a time: analysing them only reports the violations they exist to show.
sonar.exclusions=plugins/java/scripts/hooks/__tests__/fixtures/**

# Test files stay analysed for bugs and smells but are left out of the
# duplication metric: each plugin under plugins/ is installed on its own and
# can share code only through the published ad-lfl-kit, so their test helpers
# (scratch dirs and repos, hook runners) are deliberately parallel copies.
sonar.cpd.exclusions=**/__tests__/**
